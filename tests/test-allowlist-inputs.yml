name: Test allowlist and denylist inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          allow-ghsas: "GHSA-abcd-1234-5679"
          allow-dependencies-licenses: "pkg:npm/express"
          deny-packages: "pkg:npm/malicious-pkg"
          deny-groups: "pkg:npm/bad-group/"
          base-ref: HEAD
          head-ref: HEAD
          warn-only: "true"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with allowlist/denylist inputs"
          echo "PASS"
