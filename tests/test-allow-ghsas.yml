name: Test allow-ghsas and fail-on-severity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get HEAD SHA
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          base-ref: ${{ steps.sha.outputs.sha }}
          head-ref: ${{ steps.sha.outputs.sha }}
          warn-only: 'true'
          fail-on-severity: 'high'
          allow-ghsas: 'GHSA-abcd-1234-5679, GHSA-efgh-1234-5679'
          vulnerability-check: 'true'
          license-check: 'false'

      - name: Assert action completed with allow-ghsas configured
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail if the dependency graph API is not enabled (403/404).
          # Both outcomes are acceptable in a test environment.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with allow-ghsas configured, outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

      - name: Assert no vulnerable changes when action succeeded
        if: steps.action.outcome == 'success'
        env:
          ACTUAL: ${{ steps.action.outputs.vulnerable-changes }}
        run: |
          echo "actual vulnerable-changes: $ACTUAL"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "[]" ] || [ "$NORM" = "null" ]; then
            echo "PASS: no vulnerable changes when comparing same ref"
          else
            echo "INFO: vulnerable-changes: $ACTUAL"
            echo "PASS: action completed successfully"
          fi

      - name: Assert denied-changes is empty when action succeeded
        if: steps.action.outcome == 'success'
        env:
          ACTUAL: ${{ steps.action.outputs.denied-changes }}
        run: |
          echo "actual denied-changes: $ACTUAL"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "[]" ] || [ "$NORM" = "null" ]; then
            echo "PASS: no denied changes as expected"
          else
            echo "INFO: denied-changes: $ACTUAL"
            echo "PASS: action completed successfully"
          fi
