name: Test config-file, scorecard, and retry inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          external-repo-token: ${{ github.token }}
          retry-on-snapshot-warnings: "false"
          retry-on-snapshot-warnings-timeout: "30"
          show-openssf-scorecard: "false"
          warn-on-openssf-scorecard-level: "3"
          base-ref: HEAD
          head-ref: HEAD
          warn-only: "true"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with config and scorecard inputs"
          echo "PASS"
