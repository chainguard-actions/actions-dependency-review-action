name: Test basic usage with warn-only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
      GITHUB_REPOSITORY: actions/dependency-review-action
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          base-ref: HEAD~1
          head-ref: HEAD
          warn-only: 'true'
          vulnerability-check: 'true'
          license-check: 'false'
        continue-on-error: true

      - name: Assert action ran (outcome is success or failure, not skipped)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail due to API limitations in act environment
          # but it should not be skipped or cancelled
          outcome="${{ steps.action.outcome }}"
          if [ "$outcome" = "skipped" ] || [ "$outcome" = "cancelled" ]; then
            echo "FAIL: action was $outcome, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$outcome (API errors are expected in act)"
