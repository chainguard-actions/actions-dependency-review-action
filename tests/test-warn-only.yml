name: Test warn-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get HEAD SHA
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          base-ref: ${{ steps.sha.outputs.sha }}
          head-ref: ${{ steps.sha.outputs.sha }}
          warn-only: 'true'
          fail-on-severity: 'critical'
          vulnerability-check: 'true'
          license-check: 'true'

      - name: Assert action completed (warn-only mode)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # warn-only: 'true' means the action should not fail due to vulnerabilities.
          # It may still fail if the dependency graph API is not enabled (403/404).
          # Both outcomes are acceptable in a test environment.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

      - name: Assert dependency-changes output when action succeeded
        if: steps.action.outcome == 'success'
        env:
          ACTUAL: ${{ steps.action.outputs.dependency-changes }}
        run: |
          echo "actual dependency-changes: $ACTUAL"
          # Output should be defined (even if empty array)
          echo "PASS: dependency-changes output is present (value: $ACTUAL)"

      - name: Assert invalid-license-changes output when action succeeded
        if: steps.action.outcome == 'success'
        env:
          ACTUAL: ${{ steps.action.outputs.invalid-license-changes }}
        run: |
          echo "actual invalid-license-changes: $ACTUAL"
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ -z "$NORM" ] || [ "$NORM" = "[]" ] || [ "$NORM" = "null" ]; then
            echo "PASS: no invalid license changes (same ref comparison)"
          else
            echo "INFO: invalid-license-changes: $ACTUAL"
            echo "PASS"
          fi
