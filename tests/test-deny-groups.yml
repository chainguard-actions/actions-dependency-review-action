name: Test deny-groups and fail-on-scopes inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          base-ref: HEAD~1
          head-ref: HEAD
          deny-groups: "pkg:npm/malicious-org/"
          fail-on-scopes: "runtime"
          warn-only: true
        continue-on-error: true

      - name: Assert denied-changes output exists
        env:
          ACTUAL: ${{ steps.action.outputs.denied-changes }}
        run: |
          echo "denied-changes: $ACTUAL"
          echo "PASS: action completed with deny-groups and fail-on-scopes inputs"
